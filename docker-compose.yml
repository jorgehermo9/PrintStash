# PrintStash — start here: docker compose up -d, then open http://localhost:3000
# One container (web UI + API), SQLite and local storage. No .env needed.
# Optional settings: docs/deployment.md
# Every setting, PostgreSQL and S3: docker-compose.advanced.yml
services:
  printstash:
    # PRINTSTASH_IMAGE selects a fork's GHCR namespace or a locally built image.
    image: ${PRINTSTASH_IMAGE:-ghcr.io/xiao-villamor/printstash}:${PRINTSTASH_VERSION:-latest}
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "${PRINTSTASH_HTTP_PORT:-3000}:3000"
    environment:
      VAULT_SETUP_MODE: trusted_network
      VAULT_RESTART_ENABLED: "true"
    volumes:
      - printstash_data:/data/files
      - printstash_thumbs:/data/thumbs
      - printstash_db:/data/db
      - printstash_staging:/data/staging
      - printstash_backups:/data/backups

volumes:
  printstash_data:
  printstash_thumbs:
  printstash_db:
  printstash_staging:
  printstash_backups:
