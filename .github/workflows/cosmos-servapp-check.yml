name: cosmos-servapp-check

on:
  push:
    branches: [ci/cosmos-servapp-check]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  container-first-run:
    name: Real container, manifest environment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Runner has Docker
        run: docker version --format 'server {{.Server.Version}}'

      - name: Render the manifest compose
        run: |
          cat > docker-compose.yml <<'YAML'
          services:
            printstash:
              image: ghcr.io/xiao-villamor/printstash:0.14.0
              container_name: printstash
              restart: "no"
              stop_grace_period: 60s
              environment:
                - VAULT_SETUP_MODE=environment
                - VAULT_RESTART_ENABLED=true
                - VAULT_SETUP_ADMIN_USERNAME=admin
                - VAULT_SETUP_ADMIN_PASSWORD=correct-horse-battery-staple
                - VAULT_SETUP_ADMIN_EMAIL=
                - VAULT_COMPUTE_MODE=auto
                - VAULT_COMPUTE_MEMORY_MB=1024
                - VAULT_MESH_MEMORY_BUDGET_FRACTION=0.5
                - VAULT_EMBEDDING_MEMORY_BUDGET_FRACTION=0.25
              ports:
                - "3000:3000"
              volumes:
                - printstash-data:/data
          volumes:
            printstash-data:
          YAML
          cat docker-compose.yml

      - name: Start the container
        run: docker compose up -d

      - name: Wait for the web front on 3000
        run: |
          code=000
          for i in $(seq 1 90); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:3000/api/v1/health || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then break; fi
            sleep 5
          done
          echo "health body: $(cat /tmp/health.json 2>/dev/null)"
          test "$code" = "200"

      - name: Owner provisioned, login works through the front
        run: |
          set -euo pipefail
          curl -s http://127.0.0.1:3000/api/v1/setup/status > /tmp/status.json
          echo "setup status: $(cat /tmp/status.json)"
          jq -e '.configured == true' /tmp/status.json > /dev/null
          jq -e '.setup_available == false' /tmp/status.json > /dev/null
          jq -e '.storage_choice_required == true' /tmp/status.json > /dev/null
          curl -s -X POST http://127.0.0.1:3000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"correct-horse-battery-staple"}' > /tmp/login.json
          echo "login: $(jq -c '{scope, token_type, has_token: (.access_token != null)}' /tmp/login.json)"
          jq -e '.access_token != null' /tmp/login.json > /dev/null
          TOKEN=$(jq -r .access_token /tmp/login.json)
          curl -s http://127.0.0.1:3000/api/v1/auth/me -H "Authorization: Bearer $TOKEN" > /tmp/me.json
          echo "me: $(jq -c '{id, username, is_superuser, email}' /tmp/me.json)"
          jq -e '.username == "admin"' /tmp/me.json > /dev/null
          jq -e '.is_superuser == true' /tmp/me.json > /dev/null

      - name: Choose local storage, as the first-run screen does
        run: |
          set -euo pipefail
          TOKEN=$(curl -s -X POST http://127.0.0.1:3000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"correct-horse-battery-staple"}' | jq -r .access_token)
          curl -s -X POST http://127.0.0.1:3000/api/v1/setup/prepare-storage \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"storage_provider":"local","storage_provider_config":{"provider":"local","data_dir":"/data/models","thumb_dir":"/data/thumbnails"}}' \
            > /tmp/prep.json
          echo "prepare-storage: $(head -c 800 /tmp/prep.json)"
          curl -s http://127.0.0.1:3000/api/v1/setup/status > /tmp/status2.json
          echo "status after storage: $(cat /tmp/status2.json)"
          jq -e '.storage_choice_required == false' /tmp/status2.json > /dev/null
          curl -s http://127.0.0.1:3000/api/v1/health > /tmp/health2.json
          echo "storage roots: $(jq -c '.storage.diagnostics | {probed, roots_ready, root_bindings}' /tmp/health2.json)"

      - name: Upload a real STL and wait for the job
        run: |
          set -euo pipefail
          cat > /tmp/cube.stl <<'STL'
          solid cube
          facet normal 0 0 -1
           outer loop
            vertex 0 0 0
            vertex 0 20 0
            vertex 20 20 0
           endloop
          endfacet
          facet normal 0 0 -1
           outer loop
            vertex 0 0 0
            vertex 20 20 0
            vertex 20 0 0
           endloop
          endfacet
          facet normal 0 -1 0
           outer loop
            vertex 0 0 0
            vertex 20 0 0
            vertex 20 0 20
           endloop
          endfacet
          facet normal 0 -1 0
           outer loop
            vertex 0 0 0
            vertex 20 0 20
            vertex 0 0 20
           endloop
          endfacet
          facet normal -1 0 0
           outer loop
            vertex 0 0 0
            vertex 0 0 20
            vertex 0 20 20
           endloop
          endfacet
          facet normal -1 0 0
           outer loop
            vertex 0 0 0
            vertex 0 20 20
            vertex 0 20 0
           endloop
          endfacet
          facet normal 0 0 1
           outer loop
            vertex 0 0 20
            vertex 20 0 20
            vertex 20 20 20
           endloop
          endfacet
          facet normal 0 0 1
           outer loop
            vertex 0 0 20
            vertex 20 20 20
            vertex 0 20 20
           endloop
          endfacet
          facet normal 0 1 0
           outer loop
            vertex 0 20 0
            vertex 0 20 20
            vertex 20 20 20
           endloop
          endfacet
          facet normal 0 1 0
           outer loop
            vertex 0 20 0
            vertex 20 20 20
            vertex 20 20 0
           endloop
          endfacet
          facet normal 1 0 0
           outer loop
            vertex 20 0 0
            vertex 20 20 0
            vertex 20 20 20
           endloop
          endfacet
          facet normal 1 0 0
           outer loop
            vertex 20 0 0
            vertex 20 20 20
            vertex 20 0 20
           endloop
          endfacet
          endsolid cube
          STL
          TOKEN=$(curl -s -X POST http://127.0.0.1:3000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"correct-horse-battery-staple"}' | jq -r .access_token)
          curl -s -X POST http://127.0.0.1:3000/api/v1/ingest/model \
            -H "Authorization: Bearer $TOKEN" \
            -F "file=@/tmp/cube.stl;type=model/stl" \
            -F "model_name=Cosmos Test Cube" > /tmp/upload.json
          echo "upload: $(head -c 400 /tmp/upload.json)"
          JOB=$(jq -r '.job_id // .id // empty' /tmp/upload.json)
          test -n "$JOB"
          state=""
          for i in $(seq 1 40); do
            curl -s "http://127.0.0.1:3000/api/v1/jobs/$JOB" -H "Authorization: Bearer $TOKEN" > /tmp/job.json
            state=$(jq -r '.status // .state // empty' /tmp/job.json)
            echo "job $i: $state"
            case "$state" in completed|succeeded|done|failed|cancelled) break;; esac
            sleep 5
          done
          echo "job final: $(head -c 600 /tmp/job.json)"
          curl -s "http://127.0.0.1:3000/api/v1/models" -H "Authorization: Bearer $TOKEN" > /tmp/models.json
          echo "models: $(jq -c '[.[] | {id, name, file_count}] | .[0:5]' /tmp/models.json 2>/dev/null || head -c 400 /tmp/models.json)"
          jq -e '[.[] | select(.name == "Cosmos Test Cube")] | length > 0' /tmp/models.json > /dev/null
          echo "volume contents:"; docker exec printstash sh -c 'ls -la /data; du -sh /data/* 2>/dev/null | head'

      - name: Restart and prove /data persists the owner
        run: |
          set -euo pipefail
          docker compose restart
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/v1/health || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 5
          done
          test "$code" = "200"
          curl -s -X POST http://127.0.0.1:3000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"correct-horse-battery-staple"}' > /tmp/restart_login.json
          echo "login after restart: $(jq -c '{scope, has_token: (.access_token != null)}' /tmp/restart_login.json)"
          jq -e '.access_token != null' /tmp/restart_login.json > /dev/null
          TOKEN=$(jq -r .access_token /tmp/restart_login.json)
          curl -s "http://127.0.0.1:3000/api/v1/models" -H "Authorization: Bearer $TOKEN" > /tmp/models2.json
          echo "models after restart: $(jq -c '[.[] | .name] | .[0:5]' /tmp/models2.json)"

      - name: Publish the evidence on the branch
        if: always()
        run: |
          mkdir -p evidence
          {
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "date: $(date -u +%FT%TZ)"
            echo "docker: $(docker version --format '{{.Server.Version}}' 2>/dev/null)"
            echo "image: $(docker image inspect ghcr.io/xiao-villamor/printstash:0.14.0 --format '{{index .RepoDigests 0}}' 2>/dev/null)"
            echo "health: $(cat /tmp/health.json 2>/dev/null)"
            echo "status: $(cat /tmp/status.json 2>/dev/null)"
            echo "login: $(jq -c '{scope, token_type, has_token: (.access_token != null)}' /tmp/login.json 2>/dev/null)"
            echo "me: $(jq -c '{id, username, is_superuser, email}' /tmp/me.json 2>/dev/null)"
            echo "prepare-storage: $(head -c 900 /tmp/prep.json 2>/dev/null)"
            echo "status-after-storage: $(cat /tmp/status2.json 2>/dev/null)"
            echo "storage-roots: $(jq -c '.storage.diagnostics | {probed, roots_ready, root_bindings}' /tmp/health2.json 2>/dev/null)"
            echo "upload: $(head -c 400 /tmp/upload.json 2>/dev/null)"
            echo "job: $(head -c 600 /tmp/job.json 2>/dev/null)"
            echo "models: $(jq -c '[.[] | {id, name, file_count}] | .[0:5]' /tmp/models.json 2>/dev/null)"
            echo "login-after-restart: $(jq -c '{scope, has_token: (.access_token != null)}' /tmp/restart_login.json 2>/dev/null)"
            echo "models-after-restart: $(jq -c '[.[] | .name] | .[0:5]' /tmp/models2.json 2>/dev/null)"
            echo "container-state: $(docker inspect printstash --format '{{.State.Status}} restarts={{.RestartCount}}' 2>/dev/null)"
          } > evidence/cosmos-servapp-check.txt
          cat evidence/cosmos-servapp-check.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/cosmos-servapp-check.txt
          git commit -m "evidence: cosmos servapp container check [skip ci]" || echo "nothing to commit"
          git push

      - name: Container logs
        if: always()
        run: docker compose logs --no-color | tail -n 120
