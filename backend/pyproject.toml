[project]
name = "printstash"
version = "0.12.1"
description = "PrintStash — self-hosted 3D printing asset manager"
requires-python = ">=3.11"
dependencies = [
    "printstash-core[network,printers-all]",
    "cryptography>=50,<51",
    "alembic>=1.19,<2",
    "boto3>=1.43,<2",
    "botocore>=1.43,<2",
    "croniter>=6.2,<7",
    "fastapi>=0.141,<1",
    # SQLAlchemy needs greenlet for every asyncio path, but declares it only for
    # platform_machine in (AMD64, WIN32, aarch64, amd64, ppc64le, win32, x86_64).
    # macOS on Apple Silicon reports arm64, so that marker is False there and a
    # plain `uv sync` leaves greenlet out — `create_async_engine_for_db` then dies
    # at runtime on a developer Mac while passing in CI. Declare it ourselves so
    # the async DB capability is present on every platform we support.
    "greenlet>=3.5,<4",
    "httpx>=0.28,<0.29",
    "lxml>=6.1,<7",
    "networkx>=3.6,<4",
    "numpy>=2,<3",
    "orjson>=3.11,<4",
    "pillow>=12.3,<13",
    "prometheus-client>=0.26,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "pwdlib[argon2,bcrypt]>=0.3,<1",
    "PyJWT>=2.13,<3",
    "python-multipart>=0.0.32,<0.1",
    "psycopg[binary]>=3.3,<4",
    "SQLAlchemy>=2.0.52,<2.1",
    "sqlmodel>=0.0.39,<0.1",
    "starlette>=1.6,<2",
    "trimesh>=5,<6",
    "uvicorn[standard]>=0.52,<1",
    "watchfiles>=1.2,<2",
    "pycentauri==0.9.1",
]

[project.optional-dependencies]
async-db = [
    "aiosqlite>=0.22,<1",
]
step = [
    # OpenCASCADE tessellation; 0.1.1 ships amd64 and arm64 Linux wheels.
    "cascadio>=0.1.1,<0.2",
]
full = [
    "cascadio>=0.1.1,<0.2",
]
dev = [
    # Shipped as the `async-db` extra for operators; installed for every
    # developer and CI run so the SQLite async contracts execute instead of
    # skipping. The capability-absent path is covered by patching find_spec.
    "aiosqlite>=0.22,<1",
    "bandit>=1.8",
    "deptry>=0.23,<1",
    "httpx2>=2.10,<3",
    "pip-audit>=2.7",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "pytest-testmon>=2.2,<3",
    "pytest-xdist>=3.8,<4",
    "pytest-randomly>=3.15",
    "pyright>=1.1.403",
    "ruff>=0.8",
    # Provides the real PostgreSQL and SeaweedFS the `postgres`- and `s3`-marked
    # tests run against. There is no second path: see `tests/containers.py`.
    # Without a Docker daemon those tests skip, naming the prerequisite.
    "testcontainers[postgres]>=4.9,<5",
    "wsproto>=1.3,<2",
    "ty>=0.0.1",
]

[tool.pytest.ini_options]
# -ra surfaces every skip and xfail reason in the summary, so a resource-gated subset
# that silently stopped running is visible rather than invisible.
addopts = "--capture=sys --strict-markers -ra"
markers = [
    # Tiers. The directory a test lives in decides these; conftest.py applies them from
    # the path. unit/ and integration/ carry no marker — the lanes select them by path.
    "contract: our client against a contract-enforcing fake over a real loopback socket (lane: contract)",
    "e2e: the whole app over ASGITransport against the fakes (lane: e2e)",
    # Resources. These gate a subset *inside* a tier and skip when the resource is absent.
    "postgres: runs against a real PostgreSQL container (tests/containers.py)",
    "s3: runs against a real SeaweedFS container (tests/containers.py)",
    "slow: large real fixtures or long simulations; excluded from the fast lane",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]  # FastAPI Depends() in argument defaults is the standard pattern

[tool.deptry]
extend_exclude = ["tests"]
known_first_party = ["app"]
optional_dependencies_dev_groups = ["dev"]

[tool.deptry.per_rule_ignores]
# Runtime plugins/drivers are imported by their owning frameworks rather than
# directly by application modules. Keep this allow-list narrow and auditable.
DEP002 = [
    "aiosqlite",
    "cascadio",
    "greenlet",
    "lxml",
    "networkx",
    "psycopg",
    "python-multipart",
    "uvicorn",
]

[tool.uv.sources]
printstash-core = { workspace = true }

[tool.uv.workspace]
members = ["packages/printstash-core"]
